<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <title>Box Terminal</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%2310151c%22%2F%3E%3Cpath%20d%3D%22m8%2010%206%206-6%206m10%200h6%22%20fill%3D%22none%22%20stroke%3D%22%234ade80%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <style>/* TERMINAL_CSS */</style>
</head>
<body>
  <main id="app">
    <div id="terminal-actions">
      <span id="browse-status" role="status" hidden>Swipe to read history</span>
      <button type="button" id="browse-output">Browse output</button>
    </div>
    <div id="term" aria-label="Terminal"></div>
    <div id="selection-menu" role="toolbar" aria-label="Text selection" hidden>
      <button type="button" data-action="copy">Copy</button>
      <button type="button" data-action="paste">Paste</button>
      <button type="button" data-action="select-all">Select all</button>
      <button type="button" data-action="dismiss" aria-label="Dismiss selection">Done</button>
    </div>
    <div id="selection-start" class="selection-handle start" aria-hidden="true" hidden></div>
    <div id="selection-end" class="selection-handle end" aria-hidden="true" hidden></div>
    <div id="notice" role="status" aria-live="polite" hidden></div>
  </main>
  <dialog id="clipboard-dialog" aria-labelledby="clipboard-title" aria-describedby="clipboard-help">
    <form id="clipboard-form">
      <h2 id="clipboard-title">Paste into terminal</h2>
      <p id="clipboard-help">Long press in the field and choose Paste, then tap Paste into terminal.</p>
      <textarea id="clipboard-text" aria-label="Clipboard text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      <div class="dialog-actions">
        <button type="button" id="clipboard-cancel">Cancel</button>
        <button type="submit" id="clipboard-submit">Paste into terminal</button>
      </div>
    </form>
  </dialog>
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-unicode11@0.6.0/lib/xterm-addon-unicode11.js"></script>
  <script>/* TERMINAL_JS */</script>
</body>
</html>
